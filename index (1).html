<title>For You</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap">
<style>
  /* Layout: one centered column, one step at a time. Each step replaces the last:
     question -> photo card -> closed envelope -> letter. A single deep-wine look with ivory paper and gold detail. */
  :root {
    --night: #1D0A11;
    --night-2: #34111F;
    --ivory: #F5EBDD;
    --paper: #FBF5EC;
    --ink: #2B0F1A;
    --crimson: #A12A4F;
    --gold: #C9A25E;
    --gold-deep: #9A7634;
    --env-back: #5A1730;
    --env-front: #7B2243;
    --env-flap: #8C2B4E;
    --display: 'Playfair Display', Georgia, serif;
    --label: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    --body: 'Lora', Georgia, serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--body);
    color: var(--ivory);
    background-color: var(--night);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(161, 42, 79, .38), transparent 46%),
      radial-gradient(circle at 92% 92%, rgba(201, 162, 94, .13), transparent 50%);
    background-attachment: fixed;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-height: 100%;
    overflow-x: hidden;
  }

  .hearts { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .hearts svg { position: absolute; bottom: -60px; fill: var(--gold); opacity: .13; animation: rise linear infinite; }
  @keyframes rise { to { transform: translateY(-115vh) rotate(24deg); } }

  .screen {
    position: relative; z-index: 1;
    min-height: 85vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px; text-align: center;
    width: min(100%, 640px); margin-inline: auto;
  }
  .enter { animation: fadeUp .7s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  .script { font-family: var(--display); font-style: italic; font-weight: 500; color: var(--gold); line-height: 1.15; margin: 0; letter-spacing: .01em; }
  .script.lg { font-size: clamp(1.9rem, 8vw, 2.7rem); }
  .script.md { font-size: clamp(1.5rem, 6vw, 2rem); }

  h1.question {
    font-family: var(--display); font-style: italic; font-weight: 600;
    font-size: clamp(2.3rem, 10.5vw, 4.2rem); line-height: 1.1; margin: 0;
    text-wrap: balance; color: var(--ivory);
  }

  .ico { width: 1em; height: 1em; fill: currentColor; display: inline-block; vertical-align: -0.12em; }
  .big-heart { width: 56px; height: 56px; fill: var(--gold); animation: beat 1.8s ease-in-out infinite; filter: drop-shadow(0 8px 16px rgba(0, 0, 0, .45)); }
  @keyframes beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.12); } 28% { transform: scale(1); } 42% { transform: scale(1.08); } 56% { transform: scale(1); } }

  .btn {
    font: 500 1.02rem/1 var(--label);
    min-height: 50px; padding: .95em 2.4em; border-radius: 999px;
    border: 1.5px solid var(--gold); cursor: pointer; letter-spacing: .12em; text-transform: uppercase;
    transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease;
  }
  .btn:focus-visible { outline: 3px solid var(--ivory); outline-offset: 3px; }
  .btn-yes { background: var(--gold); color: var(--night); box-shadow: 0 14px 30px -12px rgba(201, 162, 94, .6); padding-inline: 3em; }
  .btn-yes:hover { transform: scale(1.05); }
  .btn-yes:active { transform: scale(.98); }
  .btn-no { background: transparent; color: var(--ivory); border-color: rgba(245, 235, 221, .5); }
  .btn-no.flee { position: fixed; z-index: 30; transition: left .22s ease, top .22s ease; touch-action: none; margin: 0; background: var(--night); }
  .btn-next { background: var(--gold); color: var(--night); box-shadow: 0 14px 30px -12px rgba(201, 162, 94, .55); }
  .btn-next:hover { transform: translateY(-2px); }
  .btn-open { background: transparent; color: var(--ivory); transition: opacity .4s ease, transform .2s ease; }
  .btn-open:hover { transform: translateY(-2px); }
  .btn-open.gone { opacity: 0; pointer-events: none; }

  .choices { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: center; }
  .no-slot { display: inline-block; }
  .taunt { margin: 0; font-style: italic; font-size: 1rem; color: rgba(245, 235, 221, .72); }

  /* Photo card */
  .card {
    position: relative; width: 100%; background: var(--paper); color: var(--ink);
    padding: 34px 22px 30px; border-radius: 4px;
    box-shadow: 0 34px 70px -28px rgba(0, 0, 0, .75), 0 0 0 1px rgba(201, 162, 94, .55);
    display: flex; flex-direction: column; align-items: center; gap: 22px;
  }
  .card::before { content: ""; position: absolute; inset: 9px; border: 1px solid rgba(154, 118, 52, .6); border-radius: 2px; pointer-events: none; }
  .card .corner { position: absolute; width: 14px; height: 14px; fill: var(--crimson); }
  .corner.tl { top: 3px; left: 3px; } .corner.tr { top: 3px; right: 3px; }
  .corner.bl { bottom: 3px; left: 3px; } .corner.br { bottom: 3px; right: 3px; }
  .card .script { color: var(--crimson); }
  .polaroids { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 16px; width: 100%; padding-inline: 4px; }
  .polaroid { background: #fff; padding: 8px 8px 12px; box-shadow: 0 12px 24px -12px rgba(43, 15, 26, .55); transform: rotate(-2.5deg); min-width: 0; margin: 0; }
  .polaroid:nth-child(2) { transform: rotate(2.2deg); margin-top: 14px; }
  .polaroid:nth-child(3) { transform: rotate(-1.5deg); }
  .polaroid:nth-child(4) { transform: rotate(2.5deg); margin-top: 14px; }
  .polaroid:nth-child(5) { transform: rotate(-2deg); }
  .polaroid:nth-child(6) { transform: rotate(1.8deg); margin-top: 14px; }
  .polaroid.nocap { padding-bottom: 26px; }
  .photo { aspect-ratio: 1 / 1; width: 100%; background: #EFE4D6; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo.empty { border: 1.5px dashed var(--gold-deep); flex-direction: column; gap: 6px; color: var(--gold-deep); font: 400 .72rem/1 var(--label); letter-spacing: .12em; text-transform: uppercase; }
  .photo.empty svg { width: 26px; height: 26px; fill: var(--gold); }
  .polaroid figcaption { font: 500 .72rem/1 var(--label); letter-spacing: .2em; text-transform: uppercase; color: var(--ink); margin-top: 10px; }
  .card .line { margin: 0; font-style: italic; font-size: 1rem; text-wrap: balance; position: relative; z-index: 1; }
  .card .line.forever { font-family: var(--display); font-size: 1.2rem; color: var(--crimson); margin-top: -10px; }

  /* Envelope */
  .env-wrap { margin-top: 90px; width: 100%; display: flex; justify-content: center; }
  .envelope { position: relative; width: min(340px, 100%); aspect-ratio: 10 / 7; perspective: 900px; filter: drop-shadow(0 24px 28px rgba(0, 0, 0, .55)); }
  .env-body { position: absolute; inset: 0; background: var(--env-back); border-radius: 5px; z-index: 0; }
  .env-paper {
    position: absolute; left: 7%; right: 7%; top: 7%; height: 80%; z-index: 2;
    background: var(--paper); border-radius: 3px;
    background-image: repeating-linear-gradient(to bottom, transparent 0 17px, rgba(43, 15, 26, .12) 17px 18px);
    background-position: 0 22px;
    transition: transform .9s ease .5s;
  }
  .env-front { position: absolute; inset: 0; z-index: 3; background: var(--env-front); clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%); border-radius: 5px; }
  .env-flap { position: absolute; left: 0; top: 0; width: 100%; height: 58%; z-index: 4; background: var(--env-flap); clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top center; transition: transform .75s ease; }
  .seal {
    position: absolute; left: 50%; top: 58%; width: 46px; height: 46px; z-index: 5;
    transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #E2C07F, #9A7634);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, .5); transition: opacity .3s ease, transform .3s ease;
  }
  .seal svg { width: 22px; height: 22px; fill: var(--night); }
  .envelope.open .env-flap { transform: rotateX(180deg); z-index: 1; }
  .envelope.open .env-paper { transform: translateY(-62%); }
  .envelope.open .seal { opacity: 0; transform: translate(-50%, -50%) scale(.5); }

  /* Letter */
  #letter { justify-content: flex-start; padding-top: 12px; padding-bottom: 36px; }
  .letter {
    width: 100%; background: var(--paper); color: var(--ink); text-align: left;
    padding: clamp(28px, 6vw, 52px) clamp(22px, 6vw, 48px);
    border-radius: 3px; display: flex; flex-direction: column; gap: 1.15em;
    box-shadow: 0 34px 70px -30px rgba(0, 0, 0, .8), 0 0 0 1px rgba(201, 162, 94, .55);
    border-top: 4px solid var(--gold);
    transform-origin: top center; animation: unfold 1s ease both;
  }
  @keyframes unfold { from { opacity: 0; transform: perspective(900px) rotateX(-65deg) scaleY(.5); } to { opacity: 1; transform: none; } }
  .letter p { margin: 0; line-height: 1.85; font-size: clamp(1rem, 3.9vw, 1.12rem); max-width: 65ch; }
  .letter p.sign { font-family: var(--display); font-style: italic; font-weight: 500; font-size: clamp(1.15rem, 4.6vw, 1.4rem); color: var(--crimson); text-align: center; line-height: 1.5; padding-top: .4em; text-wrap: balance; }

  .burst { position: fixed; z-index: 60; pointer-events: none; animation: burst 1.4s ease-out forwards; }
  @keyframes burst { from { opacity: 1; transform: translate(0, 0) scale(.4); } to { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1); } }

  @media (prefers-reduced-motion: reduce) {
    .hearts { display: none; }
    .big-heart, .enter, .letter { animation: none; }
    .env-flap, .env-paper, .seal, .btn-no.flee { transition: none; }
    .burst { display: none; }
  }

  /* Password gate */
  .gate form { display: flex; flex-direction: column; align-items: center; gap: 16px; width: min(100%, 320px); }
  .gate label { font: 500 .8rem/1 var(--label); letter-spacing: .16em; text-transform: uppercase; color: rgba(245, 235, 221, .75); }
  .gate input {
    width: 100%; min-height: 50px; padding: .8em 1.3em; border-radius: 999px; text-align: center;
    font: 400 16px/1.2 var(--body); color: var(--ivory); background: rgba(245, 235, 221, .07);
    border: 1.5px solid rgba(201, 162, 94, .7); letter-spacing: .08em;
  }
  .gate input:focus-visible { outline: 3px solid var(--ivory); outline-offset: 3px; }
  .gate-msg { margin: 0; min-height: 1.4em; font-style: italic; font-size: .95rem; color: var(--gold); }
  .gate .btn[disabled] { opacity: .6; cursor: default; }
</style>

</svg>

<div class="hearts" id="hearts" aria-hidden="true"></div>


<section class="screen gate" id="gate">
  <svg class="big-heart" aria-hidden="true"><use href="#heart"/></svg>
  <p class="script lg">For you</p>
  <form id="gateForm" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button class="btn btn-yes" id="gateBtn" type="submit">Open</button>
    <p class="gate-msg" id="gateMsg" role="alert"></p>
  </form>
</section>

<main id="app"></main>
